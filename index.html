<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web OS Portfolio Template // Modern Desktop & Mobile Experience</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-cyberpunk">

    <!-- Desktop Background Canvas (Interactive Grid & Particles) -->
    <canvas id="desktop-canvas"></canvas>

    <!-- Mobile OS Status Bar (Visible on mobile < 768px) -->
    <div class="mobile-status-bar" id="mobile-status-bar">
        <div class="mobile-status-time" id="mobile-clock">12:00</div>
        <div class="mobile-status-icons">
            <span class="mobile-carrier-pill">5G</span>
            <i data-lucide="wifi" class="mobile-status-icon"></i>
            <i data-lucide="battery-charging" class="mobile-status-icon"></i>
        </div>
    </div>

    <!-- Main Workspace (Desktop & Mobile Home Screen) -->
    <div class="desktop" id="desktop">

        <!-- Mobile Hero Widget (Clock & Greeting, visible on mobile) -->
        <div class="mobile-hero-widget">
            <div class="mobile-hero-time" id="mobile-hero-time">12:00</div>
            <div class="mobile-hero-date" id="mobile-hero-date">Monday, Nov 9</div>
            <div class="mobile-hero-pill">
                <span class="status-dot"></span>
                <span>Web OS Template • Online</span>
            </div>
        </div>

        <!-- Desktop & Mobile App Icons Grid -->
        <div class="desktop-icons" id="desktop-icons">
            <!-- Terminal Shortcut -->
            <div class="desktop-icon" data-app="terminal" tabindex="0">
                <div class="icon-img-wrap icon-terminal">
                    <i data-lucide="terminal" class="desktop-svg-icon"></i>
                </div>
                <span class="icon-label">Terminal</span>
            </div>

            <!-- Projects Shortcut -->
            <div class="desktop-icon" data-app="projects" tabindex="0">
                <div class="icon-img-wrap icon-projects">
                    <i data-lucide="folder-git-2" class="desktop-svg-icon"></i>
                </div>
                <span class="icon-label">Projects</span>
            </div>

            <!-- Skills Shortcut -->
            <div class="desktop-icon" data-app="skills" tabindex="0">
                <div class="icon-img-wrap icon-skills">
                    <i data-lucide="code-2" class="desktop-svg-icon"></i>
                </div>
                <span class="icon-label">Skills</span>
            </div>

            <!-- Contact Shortcut -->
            <div class="desktop-icon" data-app="contact" tabindex="0">
                <div class="icon-img-wrap icon-contact">
                    <i data-lucide="mail" class="desktop-svg-icon"></i>
                </div>
                <span class="icon-label">Contact</span>
            </div>

            <!-- GitHub External Shortcut -->
            <a href="https://github.com/developer-username" target="_blank" rel="noopener noreferrer" class="desktop-icon" tabindex="0" style="text-decoration: none;">
                <div class="icon-img-wrap icon-github">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" class="brand-svg-icon"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                </div>
                <span class="icon-label">GitHub</span>
            </a>

            <!-- LinkedIn External Shortcut -->
            <a href="https://linkedin.com/in/developer-username" target="_blank" rel="noopener noreferrer" class="desktop-icon" tabindex="0" style="text-decoration: none;">
                <div class="icon-img-wrap icon-linkedin">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" class="brand-svg-icon"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                </div>
                <span class="icon-label">LinkedIn</span>
            </a>
        </div>

        <!-- Mobile Floating Dock (iOS Style at Bottom) -->
        <div class="mobile-dock" id="mobile-dock">
            <div class="mobile-dock-btn" data-app="terminal" title="Terminal">
                <i data-lucide="terminal"></i>
            </div>
            <div class="mobile-dock-btn" data-app="projects" title="Projects">
                <i data-lucide="folder-git-2"></i>
            </div>
            <div class="mobile-dock-btn" data-app="skills" title="Skills">
                <i data-lucide="code-2"></i>
            </div>
            <div class="mobile-dock-btn" data-app="contact" title="Contact">
                <i data-lucide="mail"></i>
            </div>
        </div>

        <!-- Windows Container (Windows render dynamically here) -->
        <div id="windows-layer" class="windows-layer"></div>

        <!-- Start Menu Launcher (Pops up from taskbar on desktop) -->
        <div id="start-menu" class="start-menu hidden">
            <div class="start-header">
                <div class="user-avatar">
                    <i data-lucide="user" class="avatar-icon"></i>
                </div>
                <div class="user-meta">
                    <strong class="user-name">Developer Name</strong>
                    <span class="user-role">Full-Stack Software Engineer</span>
                </div>
            </div>

            <div class="start-section-title">PINNED APPLICATIONS</div>
            <div class="start-grid">
                <button class="start-app-btn" data-app="terminal">
                    <span class="app-btn-icon icon-terminal"><i data-lucide="terminal"></i></span>
                    <span class="app-btn-name">Terminal</span>
                </button>
                <button class="start-app-btn" data-app="projects">
                    <span class="app-btn-icon icon-projects"><i data-lucide="folder-git-2"></i></span>
                    <span class="app-btn-name">Projects</span>
                </button>
                <button class="start-app-btn" data-app="skills">
                    <span class="app-btn-icon icon-skills"><i data-lucide="code-2"></i></span>
                    <span class="app-btn-name">Skills</span>
                </button>
                <button class="start-app-btn" data-app="contact">
                    <span class="app-btn-icon icon-contact"><i data-lucide="mail"></i></span>
                    <span class="app-btn-name">Contact</span>
                </button>
            </div>

            <div class="start-section-title">QUICK LINKS</div>
            <div class="start-links">
                <a href="https://github.com/developer-username" target="_blank" rel="noopener noreferrer" class="start-link-item">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    <span>GitHub Profile</span>
                </a>
                <a href="https://linkedin.com/in/developer-username" target="_blank" rel="noopener noreferrer" class="start-link-item">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                    <span>LinkedIn Network</span>
                </a>
                <button id="btn-matrix-rain" class="start-link-item">
                    <i data-lucide="binary" class="menu-svg-icon"></i>
                    <span>Matrix Digital Rain</span>
                </button>
            </div>

            <div class="start-footer">
                <div class="system-status">
                    <span class="status-dot"></span>
                    <span>Web OS v1.0 • Template</span>
                </div>
                <button id="btn-restart" class="btn-subtle" title="Reload Desktop">
                    <i data-lucide="refresh-cw" class="refresh-icon"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Bottom Desktop Taskbar (Hidden on mobile < 768px) -->
    <footer class="taskbar" id="taskbar">
        <!-- Start / Logo Button -->
        <button id="start-btn" class="taskbar-start" title="System Menu">
            <i data-lucide="command" class="start-icon"></i>
            <span class="start-text">WebOS</span>
        </button>

        <div class="taskbar-divider"></div>

        <!-- Running Apps / Window Tabs -->
        <div id="taskbar-apps" class="taskbar-apps">
            <!-- Active tabs injected dynamically here -->
        </div>

        <!-- Taskbar System Tray -->
        <div class="taskbar-tray">
            <!-- Theme Switcher -->
            <div class="tray-dropdown-wrap">
                <button id="btn-tray-theme" class="tray-btn" title="Switch Theme">
                    <i data-lucide="palette"></i>
                </button>
                <div id="theme-menu" class="theme-menu hidden">
                    <button class="theme-opt" data-theme="theme-cyberpunk"><span class="theme-preview-dot theme-dot-cyberpunk"></span> Cyberpunk</button>
                    <button class="theme-opt" data-theme="theme-matrix"><span class="theme-preview-dot theme-dot-matrix"></span> Matrix</button>
                    <button class="theme-opt" data-theme="theme-dracula"><span class="theme-preview-dot theme-dot-dracula"></span> Dracula</button>
                    <button class="theme-opt" data-theme="theme-amber"><span class="theme-preview-dot theme-dot-amber"></span> Amber CRT</button>
                </div>
            </div>

            <!-- Audio Toggle -->
            <button id="btn-tray-sound" class="tray-btn" title="Toggle Sound">
                <i data-lucide="volume-2" id="tray-sound-icon"></i>
            </button>

            <!-- Edge Status Indicator -->
            <div class="tray-pill hidden-sm" title="Connected to Cloudflare Edge">
                <i data-lucide="wifi" class="tray-wifi-icon"></i>
                <span>EDGE</span>
            </div>

            <!-- Live Clock -->
            <div class="tray-clock" id="tray-clock" title="System Time">
                <span id="clock-time">12:00:00 PM</span>
                <span id="clock-date" class="clock-date">Nov 9, 2026</span>
            </div>
        </div>
    </footer>

    <!-- Matrix Digital Rain Canvas Overlay -->
    <canvas id="matrix-canvas" class="matrix-canvas hidden"></canvas>

    <!-- OS Scripts -->
    <script src="terminal.js"></script>
    <script src="os.js"></script>
</body>
</html>
